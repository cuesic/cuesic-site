<!doctype html>
<!--
  Cuesic shared-event bounce page.

  Deploy: copy this file to /e/index.html in the repo that serves cuesic.com (GitHub
  Pages), so it is reachable at https://cuesic.com/e/. Shared links look like
  https://cuesic.com/e/?id=<eventId> — the query-string form is used because GitHub
  Pages is static with no rewrite rules, so a path like /e/<eventId> would 404 (and a
  404 also breaks the iMessage link preview).

  If cuesic.com later moves to a host with rewrites (Netlify, Cloudflare Pages, Vercel),
  route /e/* to this file and the prettier /e/<eventId> form can be used instead — the
  script below already reads an id from the path as a fallback.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cuesic — Your EDM Home Base</title>

<!--
  Open Graph tags build the rich preview card in iMessage, WhatsApp, Slack and
  the rest. They must be present in the HTML as served: link crawlers do not run
  JavaScript, so this page cannot look the event up and describe it. That is why
  the card is generic Cuesic branding rather than the shared event's own name and
  poster — per-event previews would need a host that renders server-side.

  og:image must be an absolute URL. A relative path silently produces a card with
  no thumbnail, which is the usual reason these look broken.
-->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Cuesic" />
<meta property="og:title" content="Cuesic — Your EDM Home Base" />
<meta property="og:description" content="Discover EDM shows and festivals, see which friends are going, and keep track of every set you catch." />
<meta property="og:url" content="https://cuesic.com/e/" />
<meta property="og:image" content="https://cuesic.com/assets/OG_HomeBase.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="Cuesic — Your EDM Home Base" />

<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Cuesic — Your EDM Home Base" />
<meta name="twitter:description" content="Discover EDM shows and festivals, see which friends are going, and keep track of every set you catch." />
<meta name="twitter:image" content="https://cuesic.com/assets/OG_HomeBase.png" />
<style>
  html, body {
    height: 100%;
    margin: 0;
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
  h1 { font-size: 20px; font-weight: 700; margin: 0; letter-spacing: -0.2px; }
  p { font-size: 14px; margin: 0; color: rgba(255, 255, 255, 0.6); }
  a { color: #9b6bff; font-size: 14px; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<main>
  <h1>Opening Cuesic…</h1>
  <p>Taking you to this event.</p>
  <a id="fallback" href="https://cuesic.com/app/">Get the Cuesic app</a>
</main>
<script>
  // Where people land when the app doesn't open (not installed, or desktop): the
  // app page, not the marketing homepage. At launch, change it to
  // https://apps.apple.com/app/id6783059635 (the listing doesn't exist until then).
  var FALLBACK_URL = "https://cuesic.com/app/";

  // Event id: ?id=<eventId> is the canonical form; a trailing path segment
  // (/e/<eventId>) is tolerated in case the site moves to a host with rewrites.
  var params = new URLSearchParams(window.location.search);
  var eventId = params.get("id");
  if (!eventId) {
    var segments = window.location.pathname.split("/").filter(Boolean);
    var last = segments[segments.length - 1];
    if (last && last !== "e" && last !== "index.html") eventId = last;
  }

  document.getElementById("fallback").href = FALLBACK_URL;

  if (eventId) {
    window.location.href = "ravehub://event?id=" + encodeURIComponent(eventId);
    // If the app took over, this tab is backgrounded and the timer never fires.
    setTimeout(function () {
      if (!document.hidden) window.location.replace(FALLBACK_URL);
    }, 1500);
  } else {
    window.location.replace(FALLBACK_URL);
  }
</script>
</body>
</html>
