<!doctype html>
<!--
  Cuesic "page not found" page. Cloudflare Pages serves this file, with status
  404, for any path that has no page of its own. It can be served at any depth,
  so every asset path below is absolute. Kept out of search results.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Page not found | Cuesic</title>
<meta name="description" content="This page doesn't exist." />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0b0b0d" />
<link rel="icon" type="image/png" href="/assets/favicon.png" />
<link rel="apple-touch-icon" href="/assets/favicon.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0b0b0d;
    --ink: #f5f5f7;
    --muted: #a1a1aa;
    --brand: #cb6ce6;
    --brand-hi: #e3a8f5;
    --ease: cubic-bezier(.34, 1.56, .64, 1);
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink); font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(90% 55% at 50% -8%, rgba(203, 108, 230, .30), transparent 70%),
      radial-gradient(70% 45% at 100% 100%, rgba(115, 67, 235, .16), transparent 70%),
      var(--bg);
    padding: max(44px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: rgba(203, 108, 230, .4); color: #fff; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; border-radius: 8px; }
  main { width: 100%; max-width: 440px; text-align: center; }

  .logo-link { display: inline-block; margin-bottom: 36px; }
  .logo { width: 180px; max-width: 60vw; height: auto; display: block; filter: drop-shadow(0 8px 30px rgba(203, 108, 230, .4)); }

  .code {
    margin: 0 0 6px; font-size: clamp(5rem, 28vw, 8rem); font-weight: 800;
    line-height: 1; letter-spacing: -.06em;
    background: linear-gradient(110deg, var(--brand-hi) 0%, var(--brand) 50%, #7343eb 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  h1 { margin: 0 0 12px; font-size: 1.6rem; font-weight: 800; letter-spacing: -.03em; line-height: 1.2; }
  p.msg { margin: 0 auto 32px; max-width: 34ch; color: var(--muted); font-size: 1rem; line-height: 1.6; }

  .actions { display: grid; gap: 12px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    min-height: 52px; padding: 14px 26px; border-radius: 999px;
    font-weight: 700; font-size: 1rem; line-height: 1.2; text-decoration: none;
    transition: transform .18s var(--ease), background-color .3s, border-color .3s, box-shadow .3s;
  }
  .btn:active { transform: scale(.96); }
  .btn svg { flex-shrink: 0; }
  .primary { background: var(--brand); color: #0b0b0d; box-shadow: 0 10px 30px rgba(203, 108, 230, .32); }
  .primary:hover { background: var(--brand-hi); box-shadow: 0 14px 40px rgba(203, 108, 230, .48); }
  .secondary { color: var(--ink); border: 1.5px solid rgba(203, 108, 230, .5); }
  .secondary:hover { background: rgba(203, 108, 230, .08); border-color: var(--brand); }

  @media (min-width: 520px) {
    .actions { grid-template-columns: 1fr 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
  }
</style>
</head>
<body>
<main>
  <a class="logo-link" href="https://cuesic.com/" aria-label="Cuesic home">
    <img class="logo" src="/assets/trimmedCuesicTransp.png" alt="Cuesic" width="320" height="132" />
  </a>
  <p class="code" aria-hidden="true">404</p>
  <h1>This page doesn't exist</h1>
  <p class="msg">The link may be broken, or the page may have moved. Head back home, or find your next show in the Cuesic app.</p>
  <div class="actions">
    <a class="btn primary" href="https://cuesic.com/">Back to Cuesic</a>
    <a class="btn secondary" href="https://apps.apple.com/us/app/cuesic-rave-edm-events/id6783059635">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12" y2="18.01"/></svg>
      <span>Get the app</span>
    </a>
  </div>
</main>
</body>
</html>
